name: Deploy to staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check before deploying
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm check:assets

      - name: Build the client
        run: pnpm --filter @acorn/client build

      # The game server goes first: apps/web binds to the World class by script
      # name, so that script has to already exist.
      - name: Deploy the game server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/game-server
          command: deploy --env staging

      # Player accounts live in a D1 database. The first deploy of an
      # environment creates it; every deploy after that finds it by name. The
      # committed config holds a placeholder id, which only this copy replaces.
      - name: Find or create the accounts database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(node tools/prepare-accounts.mjs database acorn-ash-accounts-staging)
          test -n "$id"
          grep -q 00000000-0000-0000-0000-000000000000 apps/web/wrangler.jsonc
          sed "s/00000000-0000-0000-0000-000000000000/$id/" \
            apps/web/wrangler.jsonc > apps/web/wrangler.deploy.jsonc

      # Before the website, so new code never meets old tables.
      - name: Update the accounts database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: d1 migrations apply DB --remote -c wrangler.deploy.jsonc --env staging

      - name: Deploy the website
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy -c wrangler.deploy.jsonc --env staging

      # Signs the session cookie. Made once, here, and never shown to anyone;
      # an existing one is left alone so deploying never signs players out.
      - name: Make sure sign-in has its secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/prepare-accounts.mjs secret acorn-ash-web-staging BETTER_AUTH_SECRET

      # Cloudflare takes a little while to switch every location over to a new
      # version, so right after a deploy the site can still be serving the
      # previous one, or the new page without its new files yet. Wait for the
      # live site to match what was just built, for up to three minutes, before
      # checking anything else. A deploy that really did not go live still fails.
      - name: Wait for the new version to be live
        env:
          GAME_URL: https://acorn-ash-web-staging.chrisistinson.workers.dev
        run: |
          matches_build() {
            curl --fail --silent --show-error "$GAME_URL/" -o /tmp/acorn-live-index.html || return 1
            cmp -s apps/client/dist/index.html /tmp/acorn-live-index.html || return 1
            for asset in apps/client/dist/assets/index-*.js apps/client/dist/assets/index-*.css apps/client/dist/assets/entering-the-woods-*.webp; do
              curl --fail --silent --show-error "$GAME_URL/assets/${asset##*/}" -o /tmp/acorn-live-asset || return 1
              cmp -s "$asset" /tmp/acorn-live-asset || return 1
            done
          }
          for attempt in $(seq 1 18); do
            if matches_build; then
              echo "The live site matches this build (check $attempt)."
              exit 0
            fi
            echo "Still serving the previous version (check $attempt of 18); trying again in 10 seconds."
            sleep 10
          done
          echo "::error::Three minutes after deploying, the live site still does not match what was just built."
          exit 1

      - name: Verify the live game
        env:
          GAME_URL: https://acorn-ash-web-staging.chrisistinson.workers.dev
        run: |
          curl --fail --silent --show-error --retry 3 "$GAME_URL/api/health" | jq -e '.ok == true and .service == "web"'

      # The real thing, end to end: the database exists, its tables are there,
      # the session secret works, each login service that has been set up sends
      # people to the right place and back to this address, and the shortcuts
      # meant for tests and previews are not switched on. Nobody is signed in.
      - name: Verify players can sign in
        env:
          GAME_URL: https://acorn-ash-web-staging.chrisistinson.workers.dev
        run: |
          status=$(curl --fail --silent --show-error --retry 3 "$GAME_URL/api/session")
          echo "$status" | jq -e '.signedIn == false and .testSignIn == null and (.providers | type) == "array"'

          code=$(curl --silent -o /dev/null -w '%{http_code}' -X POST "$GAME_URL/api/test-sign-in")
          test "$code" = 404 || { echo "::error::Test sign-in answered $code. It must not exist on staging."; exit 1; }

          for provider in $(echo "$status" | jq -r '.providers[]'); do
            target=$(curl --silent -o /dev/null -w '%{redirect_url}' "$GAME_URL/api/login/$provider")
            expected="redirect_uri=$(printf '%s' "$GAME_URL/api/auth/callback/$provider" | jq -sRr @uri)"
            case "$target" in
              *"$expected"*) echo "$provider sign-in sends people back to $GAME_URL" ;;
              *) echo "::error::$provider sign-in does not come back to $GAME_URL/api/auth/callback/$provider"; exit 1 ;;
            esac
          done
          if [ "$(echo "$status" | jq '.providers | length')" -eq 0 ]; then
            echo "::warning::No login service is set up on staging yet, so nobody can sign in. Add the Google and Discord secrets to the acorn-ash-web-staging Worker (see the README)."
          fi
          curl --fail --silent --show-error --retry 3 "$GAME_URL/api/worlds/home-clearing/status" | jq -e 'select((.tick | type) == "number" and (.seed | type) == "number")'
