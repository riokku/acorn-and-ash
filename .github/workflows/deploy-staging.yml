name: Deploy to staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check before deploying
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm check:assets

      - name: Build the client
        run: pnpm --filter @acorn/client build

      # The game server goes first: apps/web binds to the World class by script
      # name, so that script has to already exist.
      - name: Deploy the game server
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/game-server
          command: deploy --env staging

      - name: Deploy the website
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env staging

      - name: Verify the live game
        env:
          GAME_URL: https://acorn-ash-web-staging.chrisistinson.workers.dev
        run: |
          curl --fail --silent --show-error --retry 3 "$GAME_URL/api/health" | jq -e '.ok == true and .service == "web"'
          curl --fail --silent --show-error --retry 3 "$GAME_URL/api/worlds/home-clearing/status" | jq -e '(.tick | type) == "number" and (.seed | type) == "number"'
          curl --fail --silent --show-error --retry 3 "$GAME_URL/" -o /tmp/acorn-live-index.html
          cmp apps/client/dist/index.html /tmp/acorn-live-index.html
          for asset in apps/client/dist/assets/index-*.js apps/client/dist/assets/index-*.css apps/client/dist/assets/entering-the-woods-*.webp; do
            curl --fail --silent --show-error --retry 3 "$GAME_URL/assets/${asset##*/}" -o /tmp/acorn-live-asset
            cmp "$asset" /tmp/acorn-live-asset
          done
